<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="CS2 Dumper">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b18"/>
      <stop offset="0.55" stop-color="#0a1a33"/>
      <stop offset="1" stop-color="#071426"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e3a5f" stroke-opacity="0.28" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="260" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="22" fill="url(#grid)"/>
  <circle cx="1060" cy="60" r="150" fill="#38bdf8" fill-opacity="0.08"/>
  <circle cx="110" cy="230" r="130" fill="#818cf8" fill-opacity="0.08"/>
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>
  <text x="64" y="112" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="1">CS2 DUMPER</text>
  <text x="66" y="158" fill="#7dd3fc" font-family="Consolas, monospace" font-size="20" letter-spacing="2">OFFSETS · SIGNATURES · SCHEMAS · SDK</text>
  <text x="66" y="202" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="16">Runtime a2x + cs2-sdk · no IDA required · Windows x64</text>
  <g transform="translate(1010 170)">
    <rect x="0" y="0" width="126" height="34" rx="17" fill="#0f2a46" stroke="#38bdf8" stroke-opacity="0.55"/>
    <circle cx="18" cy="17" r="4" fill="#22d3ee"/>
    <text x="32" y="22" fill="#bae6fd" font-family="Consolas, monospace" font-size="13">build 14194</text>
  </g>
</svg>
